<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15171b" />
    <meta name="color-scheme" content="dark" />
    <title>Foreground</title>
    <meta
      name="description"
      content="A prioritization engine that scores open work on a WSJF-adapted framework with a staleness multiplier, so avoided work surfaces instead of sinking. Every ranking shows its arithmetic."
    />
    <!-- Share cards. %SITE_URL% is replaced at build time by the site-url
         plugin in vite.config.ts; image URLs must stay absolute. -->
    <meta property="og:title" content="Foreground" />
    <meta
      property="og:description"
      content="A prioritization engine that scores open work on a WSJF-adapted framework with a staleness multiplier, so avoided work surfaces instead of sinking. Every ranking shows its arithmetic."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Foreground" />
    <meta property="og:image" content="%SITE_URL%/og-foreground.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Foreground ranked backlog with a WSJF score breakdown expanded"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-foreground.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
